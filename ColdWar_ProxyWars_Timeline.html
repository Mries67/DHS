  /* responsive */
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .timeline-panel { max-height: 300px; }

  }

</head>

const regionColors = {
  asia: 'r-asia', europe: 'r-europe', africa: 'r-africa',
  latam: 'r-latam', mideast: 'r-mideast', global: 'r-global'
};

let currentFilter = 'all';
let selectedId = null;

function renderTimeline() {
  const panel = document.getElementById('timeline-panel');
  const existingAxis = panel.querySelector('.timeline-axis');
  panel.innerHTML = '';
  if (existingAxis) panel.appendChild(existingAxis);

  events.forEach(ev => {
    if (currentFilter !== 'all' && ev.region !== currentFilter) return;

    const entry = document.createElement('div');
    entry.className = 'timeline-entry' + (selectedId === ev.id ? ' active' : '');
    entry.innerHTML = `
      <div class="timeline-dot"></div>
      <div class="entry-year">${ev.year}</div>
      <div class="entry-title">${ev.title}</div>
      <span class="entry-region ${regionColors[ev.region] || 'r-global'}">${ev.regionLabel}</span>
      <div class="entry-teaser">${ev.teaser}</div>
    `;
    entry.onclick = () => selectEvent(ev.id);
    panel.appendChild(entry);
  });
}

function selectEvent(id) {
  selectedId = id;
  renderTimeline();
  const ev = events.find(e => e.id === id);

  document.getElementById('empty-state').style.display = 'none';

  const tagMap = { us: ['tag-us', 'U.S.-Backed'], ussr: ['tag-ussr', 'USSR-Backed'], local: ['tag-local', 'Local Actors'], nato: ['tag-nato', 'NATO Forces'] };
  const tagsHTML = ev.tags.map(t => `<span class="tag ${tagMap[t][0]}">${tagMap[t][1]}</span>`).join('');

  const statsHTML = ev.stats.map(s => `
    <div class="stat-box">
      <div class="stat-val">${s.val}</div>
      <div class="stat-lbl">${s.lbl}</div>
    </div>
  `).join('');

  const content = document.getElementById('detail-content');
  content.innerHTML = `
    <div class="detail-content visible">
      <div class="detail-header">
        <div class="detail-year-tag">${ev.year}</div>
        <div class="detail-title">${ev.title}</div>
        <div class="detail-tags">
          <span class="entry-region ${regionColors[ev.region] || 'r-global'}">${ev.regionLabel}</span>
          ${tagsHTML}
        </div>
      </div>

      <div class="stat-row">${statsHTML}</div>

      <div class="detail-section">
        <h3>Overview</h3>
        <p>${ev.overview}</p>
      </div>

      ${ev.usSide ? `
      <div class="detail-section">
        <h3>The Sides</h3>
        <div class="sides-grid">
          <div class="side-card side-us">
            <div class="side-label">United States / West</div>
            <ul>${ev.usSide.map(i => `<li>${i}</li>`).join('')}</ul>
          </div>
          <div class="side-card side-ussr">
            <div class="side-label">Soviet Union / East</div>
            <ul>${ev.ussrSide.map(i => `<li>${i}</li>`).join('')}</ul>
          </div>
        </div>
      </div>` : ''}

      <div class="quote-box">
        "${ev.quote}"
        <div class="quote-source">${ev.quoteSource}</div>
      </div>

      <div class="detail-section">
        <h3>Historical Legacy</h3>
        <p>${ev.legacy}</p>
      </div>

      <div class="ap-connect">
        <div class="ap-label">AP Connection</div>
        <p>${ev.apConnect}</p>
      </div>
    </div>
  `;
}

function filterRegion(region, btn) {
  currentFilter = region;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedId = null;
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('detail-content').innerHTML = '';
  renderTimeline();
}

// Initial render
const axis = document.createElement('div');
axis.className = 'timeline-axis';
document.getElementById('timeline-panel').appendChild(axis);
renderTimeline();
</script>
